name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://photobooth:photobooth@localhost:55432/photobooth?schema=public
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: photobooth
  S3_ACCESS_KEY_ID: boothapp
  S3_SECRET_ACCESS_KEY: boothapp-secret
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_BASE_URL: http://localhost:9000/photobooth

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: photobooth
          POSTGRES_PASSWORD: photobooth
          POSTGRES_DB: photobooth
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U photobooth -d photobooth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @photobooth/api db:generate

      - name: Deploy database migrations
        run: pnpm --filter @photobooth/api exec prisma migrate deploy

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build